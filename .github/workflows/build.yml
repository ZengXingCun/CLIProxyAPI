name: Build Mipsle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build for Mipsle
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -trimpath -ldflags="-s -w" -gcflags="-l" -o cli-proxy-api ./cmd/server

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-proxy-api-mipsle
          path: cli-proxy-api
